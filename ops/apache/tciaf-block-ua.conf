# Crawlers that render real PHP pages at high volume (from the 2026-09-15..29 access logs).
# Blocked crawlers may still fetch /robots.txt, which tells the well-behaved ones to stop.
SetEnvIfNoCase User-Agent "(SemrushBot|AhrefsBot|MJ12bot|dotbot|PetalBot|Sogou|WebSiphon|ShapBot)" tciaf_block_ua

# <If> + "Require all denied" only ever adds a deny. Do not use <Location "/"> + "Require all granted":
# it replaces existing denies (e.g. .phps source, server-status).
<If "reqenv('tciaf_block_ua') == '1' && %{REQUEST_URI} != '/robots.txt'">
    Require all denied
</If>
