# Let browsers cache static assets for a week. Requires mod_headers.
# js is excluded: /js/bloc.js is referenced without a version string (views/head.html).
<IfModule mod_headers.c>
    <FilesMatch "\.(ico|pdf|jpe?g|png|gif|svg|webp|css|woff2?|ttf)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>
</IfModule>
