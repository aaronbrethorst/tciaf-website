# Refuse common vulnerability-scanner probes. Most already get Apache's built-in 404 (the app's
# catch-all rewrite doesn't match them); this makes them cheap and explicit, including %2e-encoded forms.
# Stock config already denies ^\.ht files; this extends that to other dotfiles and backup/config files.
# REQUEST_URI is decoded here. /.json, /.xml etc. are real app URLs (the catch-all rewrite maps an empty
# controller plus extension to index.php; manage.js requests location.href + '.xml', e.g. /.xml or /manage/group/.xml).
# /.well-known/ is needed for certbot.
# Same <If> + "Require all denied" pattern as tciaf-block-ua.conf, for the same reason.
<If "%{REQUEST_URI} =~ m#(/\.(?!well-known/|(json|xml|html|svg|jpe?g)$)|\.(env|bak|old|orig|sql|ini|log|sh|ya?ml|git|swp)$|/wp-(login|admin|content|includes|config)|/xmlrpc\.php|/phpmyadmin|/cgi-bin/|/vendor/phpunit|/actuator)#i">
    Require all denied
</If>
