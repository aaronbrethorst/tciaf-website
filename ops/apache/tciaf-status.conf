# Loopback-only vhost so /server-status isn't swallowed by the app's catch-all rewrite.
# Usage on the server: curl -s 'http://127.0.0.1:8081/server-status?auto'
# Port 8081 is also hardcoded in ops/bin/tciaf-snapshot.
Listen 127.0.0.1:8081
<VirtualHost 127.0.0.1:8081>
    ServerName localhost
    DocumentRoot /var/www/html
    CustomLog /dev/null common
</VirtualHost>
